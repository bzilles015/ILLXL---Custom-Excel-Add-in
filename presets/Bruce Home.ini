; =============================================================
;  ILLXL preset  -  edit in Notepad, then Ctrl+Alt+Shift+S > R
; -------------------------------------------------------------
;  Colors are hex #RRGGBB.  Lists run 1, 2, 3 ... in cycle order
;  (add, remove or reorder lines freely).  Anything you leave out
;  falls back to the ILLXL defaults.  Lines starting ; are notes.
; =============================================================

[Info]
Name=Bruce Home
Description=Bruce's own style - from the original public ILLXL build (Mar 2026)

[General]
; keys ILLXL switches off because they are hit by accident
DisabledKeys=F1,ScrollLock,NumLock,Insert
; Ready to Send: zoom every sheet to this % (blank = leave each sheet's zoom)
SendReadyZoom=

; ---------------- Number formats --------------------------------
[NumberFormats]          ; Ctrl+Shift+1
1=#,##0_);(#,##0);"--";@
2=#,##0,_);(#,##0,);"--";@
3=#,##0,"K"_);(#,##0,"K");"--";@
4=#,##0.0,,_);(#,##0.0,,);"--";@
5=#,##0.0,,"M"_);(#,##0.0,,"M");"--";@

[CurrencyFormats]        ; Ctrl+Shift+4
1=$#,##0_);($#,##0);"--";@
2=$#,##0,_);($#,##0,);"--";@
3=$#,##0,"K"_);($#,##0,"K");"--";@
4=$#,##0.0,,_);($#,##0.0,,);"--";@
5=$#,##0.0,,"M"_);($#,##0.0,,"M");"--";@

[PercentFormats]         ; Ctrl+Shift+5  (1 is also used by Insert % Change)
1=0.0%;(0.0%);"—";@
2=0%;(0%);"—";@
3=+0.0%;-0.0%;"—";@
4=[<=-0.0005](0.0%);[>=0.0005]0.0%;"";@
5=0.0%;(0.0%);"";@

[DateFormats]            ; Ctrl+Shift+3
1=m/d/yyyy
2=m/d/yy
3=yyyy-mm-dd
4=mmm-yy
5=d-mmm-yy;d-mmm-yy;-

[OtherFormats]           ; Ctrl+Shift+8  (A / B / F / Q / P / E / x)
1=0\A
2=0\B
3=0\F
4="Q"#
5=0\P
6=0\E
7=0.0"x"

[TimestampFormats]       ; Ctrl+Shift+N
1=m/d/yy h:MM AM/PM
2=m/d/yy h:MM AM/PM "EST"

; ---------------- Fonts & colors --------------------------------
[Fonts]                  ; Ctrl+'
1=Aptos Narrow
2=Poppins
3=Times New Roman

[Fills]                  ; Ctrl+Shift+K    Name | #color, none or stripe
1=No Fill | none
2=Warm Yellow | #FFF2CC
3=Gray | #D9D9D9
4=Diagonal Stripe | stripe
5=Black | #000000
6=Green | #C6EFCE
7=Red | #FFC7CE
8=Magenta | #FF00FF

[FontColors]             ; Ctrl+Shift+C    Name | #color
1=Blue | #0000FF
2=Green | #008000
3=Black | #000000
4=Red | #FF0000
5=Gray | #7F7F7F
6=Purple | #7030A0
7=White | #FFFFFF

[AutoColor]              ; Ctrl+Alt+A
Hardcode=#0000FF
Formula=#000000
SameSheetLink=#000000
CrossSheetLink=#008000
ExternalLink=#FF0000

[ZeroCheck]              ; Ctrl+Alt+Shift+Z
Zero=#C6EFCE
NonZero=#FFC7CE

; ---------------- Styles ----------------------------------------
[InputStyles]            ; Ctrl+Alt+Shift+U   Name | fill | font | dotted border
1=Bruce Input | #FFF2CC | #0000FF | #000000
2=Banker Input | #FFFFCC | #0000FF | #000000
3=Gray | #D9D9D9 | #0000FF | #000000
4=FMWC Peach | #FFCC99 | #0085B2 | #7F7F7F
5=Override | #DDEBF7 | #1F4E79 | #1F4E79

[HeaderStyles]           ; Ctrl+Alt+Shift+H   Name | fill | font  (always bold)
1=Navy | #112547 | #FFFFFF
2=Mid Navy | #44546A | #FFFFFF
3=Black | #000000 | #FFFFFF
4=Blue | #4472C4 | #FFFFFF

[Headers]                ; Ctrl+Alt+Shift+Y and Ctrl+Alt+Shift+D
InsertFill=#112547
InsertFont=#FFFFFF
PromptDefault=2024A,2025B,2026E
VarianceLabels=AvF %,AvB%,Var AvB

[TabColors]              ; Ctrl+Alt+Shift+W   Name | #color or none
1=No Color | none
2=Blue - Output | #4472C4
3=Yellow - Inputs | #FFFF99
4=Green - Calcs | #00B050
5=Purple - Pivots/PQ | #7030A0
6=Red - Review | #FF0000
7=Gray - Archive | #A6A6A6

[Borders]                ; Ctrl+Alt+Shift+arrows: thin, none, medium, hairline, thick, double
CycleSteps=thin,none,medium,hairline

[Formulas]               ; Wrap IFERROR / ROUND
IfErrorValue=0
RoundDigits=0

[UnitTags]               ; comma-separated, in cycle order
Value=[#],[%],[$],[mln $],[thd $],[bn $],[x],[pp],[bps]
Duration=[d],[m],[q],[y]
Rate=[%/y],[$/unit],[$/FTE],[$/yr]

; ---------------- Shortcut keys ---------------------------------
