; =============================================================
;  ILLXL preset  -  edit in Notepad, then Ctrl+Alt+Shift+S > R
; -------------------------------------------------------------
;  Colors are hex #RRGGBB.  Lists run 1, 2, 3 ... in cycle order
;  (add, remove or reorder lines freely).  Anything you leave out
;  falls back to the ILLXL defaults.  Lines starting ; are notes.
; =============================================================

[Info]
Name=Banker
Description=Standard banker / WSP conventions - blue hardcodes, black formulas, green sheet links, red file links

[General]
; keys ILLXL switches off because they are hit by accident
DisabledKeys=F1,ScrollLock,NumLock,Insert

; ---------------- Number formats --------------------------------
[NumberFormats]          ; Ctrl+Shift+1
1=#,##0_);(#,##0);"–"_);@_)
2=#,##0.0_);(#,##0.0);"–"_);@_)
3=#,##0.00_);(#,##0.00);"–"_);@_)
4=#,##0,_);(#,##0,);"–"_);@_)
5=#,##0.0,,_);(#,##0.0,,);"–"_);@_)

[CurrencyFormats]        ; Ctrl+Shift+4
1=$#,##0_);($#,##0);"–"_);@_)
2=$#,##0.0_);($#,##0.0);"–"_);@_)
3=$#,##0.00_);($#,##0.00);"–"_);@_)
4=$#,##0,"K"_);($#,##0,"K");"–"_);@_)
5=$#,##0.0,,"M"_);($#,##0.0,,"M");"–"_);@_)

[PercentFormats]         ; Ctrl+Shift+5  (1 is also used by Insert % Change)
1=0.0%_);(0.0%);"–"_);@_)
2=0%_);(0%);"–"_);@_)
3=0.00%_);(0.00%);"–"_);@_)

[DateFormats]            ; Ctrl+Shift+3
1=mmm-yy
2=m/d/yyyy
3=mmm-yyyy
4=yyyy

[OtherFormats]           ; Ctrl+Shift+8  (A / B / F / Q / P / E / x)
1=0.0"x"_)
2=0"A"
3=0"E"
4=0"B"
5=0"F"

[TimestampFormats]       ; Ctrl+Shift+N
1=m/d/yyyy h:mm AM/PM
2=m/d/yyyy

; ---------------- Fonts & colors --------------------------------
[Fonts]                  ; Ctrl+'
1=Arial
2=Calibri
3=Times New Roman

[Fills]                  ; Ctrl+Shift+K    Name | #color, none or stripe
1=No Fill | none
2=Light Yellow | #FFFFCC
3=Light Gray | #F2F2F2
4=Gray | #D9D9D9
5=Light Blue | #DDEBF7
6=Diagonal Stripe | stripe

[FontColors]             ; Ctrl+Shift+C    Name | #color
1=Blue | #0000FF
2=Black | #000000
3=Green | #008000
4=Red | #FF0000
5=Gray | #808080
6=White | #FFFFFF

[AutoColor]              ; Ctrl+Alt+A
Hardcode=#0000FF
Formula=#000000
SameSheetLink=#000000
CrossSheetLink=#008000
ExternalLink=#FF0000

[ZeroCheck]              ; Ctrl+Alt+Shift+Z
Zero=#C6EFCE
NonZero=#FFC7CE

; ---------------- Styles ----------------------------------------
[InputStyles]            ; Ctrl+Alt+Shift+U   Name | fill | font | dotted border
1=Banker Input | #FFFFCC | #0000FF | #000000
2=Gray | #D9D9D9 | #0000FF | #000000
3=Override | #DDEBF7 | #00008B | #000000

[HeaderStyles]           ; Ctrl+Alt+Shift+H   Name | fill | font  (always bold)
1=Navy | #1F3864 | #FFFFFF
2=Black | #000000 | #FFFFFF
3=Light Gray | #D9D9D9 | #000000
4=Blue | #4472C4 | #FFFFFF

[Headers]                ; Ctrl+Alt+Shift+Y and Ctrl+Alt+Shift+D
InsertFill=#1F3864
InsertFont=#FFFFFF
PromptDefault=2024A,2025A,2026E
VarianceLabels=Var $,Var %

[TabColors]              ; Ctrl+Alt+Shift+W   Name | #color or none
1=No Color | none
2=Blue - Output | #4472C4
3=Yellow - Inputs | #FFFF99
4=Green - Calcs | #00B050
5=Purple - Pivots/PQ | #7030A0
6=Red - Review | #FF0000
7=Gray - Archive | #A6A6A6

[Borders]                ; Ctrl+Alt+Shift+arrows: thin, none, medium, hairline, thick, double
CycleSteps=thin,medium,none

[UnitTags]               ; comma-separated, in cycle order
Value=[#],[%],[$],[mln $],[thd $],[bn $],[x],[pp],[bps]
Duration=[d],[m],[q],[y]
Rate=[%/y],[$/unit],[$/FTE],[$/yr]

; ---------------- Shortcut keys ---------------------------------
; Ctrl / Alt / Shift + key.  Leave blank to switch a shortcut off.
[Keys]
ShowSettings=Ctrl+Alt+Shift+S
TogglePerformanceMode=Ctrl+Alt+Shift+M
MakeRefsAbsolute=Ctrl+Alt+Shift+A
MakeRefsRelative=Ctrl+Alt+Shift+R
GoToNextBlank=Ctrl+Alt+Shift+N
GoToNextError=Ctrl+Alt+Shift+E
ToggleErrorChecking=Ctrl+Alt+Shift+K
CycleNumberFormat=Ctrl+Shift+1
CycleDateFormat=Ctrl+Shift+3
CycleCurrencyFormat=Ctrl+Shift+4
CyclePercentFormat=Ctrl+Shift+5
CycleOtherNumbers=Ctrl+Shift+8
IncreaseDecimal=Ctrl+Shift+.
DecreaseDecimal=Ctrl+Shift+,
ScaleUp=Alt+Shift+<
ScaleDown=Alt+Shift+>
ToggleSign=Ctrl+Alt+Shift+\
DivideByHundred=Ctrl+Alt+2
MultiplyByHundred=Ctrl+Alt+Shift+2
InsertCAGR=Ctrl+Alt+Shift+C
InsertPercentChange=Ctrl+Alt+Shift+V
EqualsLeft=Ctrl+Alt+L
ApplyGrowthRate=Ctrl+Alt+Shift+G
InsertQuickSum=Ctrl+Alt+=
InsertQuickAverage=Ctrl+Alt+Shift+=
AutoColorSelection=Ctrl+Alt+A
CycleFont=Ctrl+'
CycleFill=Ctrl+Shift+K
CycleTextCase=Ctrl+Alt+Shift+I
CycleFontColor=Ctrl+Shift+C
IncreaseFontSize=Ctrl+Shift+F
DecreaseFontSize=Ctrl+Shift+G
IndentIn=Ctrl+Alt+.
IndentOut=Ctrl+Alt+,
CenterAcrossSelection=Ctrl+Alt+E
InsertStaticNow=Ctrl+Shift+N
CycleInputStyle=Ctrl+Alt+Shift+U
CycleHeaderStyle=Ctrl+Alt+Shift+H
InsertHeadersFromPrompt=Ctrl+Alt+Shift+Y
InsertVarianceHeaders=Ctrl+Alt+Shift+D
ApplyZeroCheckCF=Ctrl+Alt+Shift+Z
ClearZeroCheckCF=Ctrl+Alt+Shift+X
CycleTabColor=Ctrl+Alt+Shift+W
BorderTop=Ctrl+Alt+Shift+Up
BorderBottom=Ctrl+Alt+Shift+Down
BorderLeft=Ctrl+Alt+Shift+Left
BorderRight=Ctrl+Alt+Shift+Right
BordersOutlineInside=Ctrl+Alt+Shift+B
ApplySumBar=Ctrl+Alt+-
ApplyDoubleSumBar=Ctrl+Alt+_
CycleUnitTag_Value_Uniform=Ctrl+Alt+Shift+T
CycleUnitTag_Duration_Uniform=Ctrl+Alt+Shift+O
CycleUnitTag_Rate_Uniform=Ctrl+Alt+Shift+P
RemoveUnitTag=Ctrl+Alt+Shift+Backspace
